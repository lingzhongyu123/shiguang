name: deploy
on:
  push:
    branches: [main]
    paths: ['app/**', 'static/**', 'requirements.txt', 'Dockerfile', '.github/workflows/deploy.yml', 'tools/deploy_render.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy exact commit and verify live version
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python tools/deploy_render.py --commit "$GITHUB_SHA"
