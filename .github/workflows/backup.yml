name: daily-backup
on:
  schedule:
    - cron: "23 21 * * *" # 每天 UTC 21:23(北京 05:23),避开整点
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export and encrypt
        env:
          PASSWORD: ${{ secrets.SHIGUANG_PASSWORD }}
          KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          set -e
          # Render 免费实例冷启动需要时间:对 502/503/超时反复重试,总容忍约 4 分钟
          login_code=""
          for i in $(seq 1 8); do
            login_code=$(curl -s -m 60 -c /tmp/c.txt -o /tmp/login.json -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              --data-binary @<(jq -n --arg p "$PASSWORD" '{password:$p}') \
              https://shiguang-ryos.onrender.com/api/login || echo 000)
            [ "$login_code" = "200" ] && break
            echo "login attempt $i -> $login_code: $(head -c 200 /tmp/login.json)"
            sleep 30
          done
          if [ "$login_code" != "200" ]; then echo "LOGIN FAILED, last code: $login_code"; exit 1; fi
          exp_code=$(curl -s -m 300 -b /tmp/c.txt -o /tmp/backup.json -w "%{http_code}" \
            https://shiguang-ryos.onrender.com/api/export/json || echo 000)
          if [ "$exp_code" != "200" ]; then echo "EXPORT FAILED: $exp_code $(head -c 200 /tmp/backup.json)"; exit 1; fi
          echo "$KEY" | openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/backup.json \
            -out backup.enc -pass stdin
          rm /tmp/backup.json /tmp/c.txt /tmp/login.json
          echo "bytes: $(wc -c < backup.enc)"
      - name: Commit
        run: |
          git config user.name "backup-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backup.enc
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily encrypted backup $(date -u +%F)"
          git push
          # 只保留最近 30 份密文提交历史之外的由 git 自身裁剪,本地文件始终只有最新一份
